<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Work Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <div class="header-row">
        <div class="header-title">
            <h1>Work Management</h1>
        </div>
        <div class="header-nav">
            <ul>
                <li><a class="header-link" href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a class="header-link" href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a></li>
                <li><a class="header-link" href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            </ul>
        </div>
    </div>
    <div class="page-content page-content-with-children">
        <div class="page-content-left">
            <h2>Register</h2>
            <p>Please fill in the form to create an account.</p>
            <form action="#" method="post" id="registerForm">
                <div class="form-group">
                    <label for="firstName">First name</label>
                    <input type="text" name="firstName" id="firstName" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last name</label>
                    <input type="text" name="lastName" id="lastName" required>
                </div>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" name="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <input type="password" name="confirmPassword" id="confirmPassword" required>
                </div>
                
                <div class="form-group">
                    <input type="checkbox" name="terms" id="terms" required><span>I agree all information is correct</span>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn" id="registerSubmit" value="Register">
                        <i class="fa-solid fa-user-plus"></i> Register
                    </button>
                </div>
            </form>
        </div>
        <div class="page-content-right">
            Already have an account? <a href="login.html">Login here</a>.
        </div>
    </div>
    <div class="footer-row">
        <small>&copy; 2026 Work Management. All rights reserved.</small></p>
    </div>

    <script src="https://kit.fontawesome.com/8b41e2246c.js" crossorigin="anonymous"></script>
</body>
</html>
