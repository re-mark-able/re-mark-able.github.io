<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Work Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <div class="header-row">
        <div class="header-title">
            <h1>Work Management</h1>
        </div>
        <div class="header-nav">
            <ul>
                <li><a class="header-link" href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a class="header-link" href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a></li>
                <li><a class="header-link" href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            </ul>
        </div>
    </div>
    <div class="page-content page-content-with-children">
        <div class="page-content-left">
            <h2>Forgot Password</h2>
            <p>Please enter your email address to reset your password.</p>
            <form action="#" method="post" id="forgotForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" name="email" id="email" required>
                    <span class="error-message" id="emailError">You must enter a valid email address.</span>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn" id="forgotSubmit" value="Reset Password" disabled>
                        <i class="fa-solid fa-key"></i> Reset Password
                    </button>
                </div>
            </form>
        </div>
       
    </div>
    <div class="footer-row">
        <small>&copy; 2026 Work Management. All rights reserved.</small></p>
    </div>
    <script type="text/javascript" src="js/forgotScripts.js"></script>
    <script src="https://kit.fontawesome.com/8b41e2246c.js" crossorigin="anonymous"></script>
</body>
</html>
