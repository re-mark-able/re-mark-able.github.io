<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Work Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Header -->
    <div class="header-row">
        <div class="header-title">
            <h1>Work Management</h1>
        </div>
        <div class="header-nav">
            <ul>
                <li><a class="header-link" href="index.html"><i class="fa-solid fa-house"></i> Home</a></li>
                <li><a class="header-link" href="register.html"><i class="fa-solid fa-user-plus"></i> Register</a></li>
                <li><a class="header-link" href="login.html"><i class="fa-solid fa-right-to-bracket"></i> Login</a></li>
            </ul>
        </div>
    </div>
    <div class="page-content page-content-with-children">
        <div class="page-content-left">
            <h2>Login</h2>
            <p>Please enter your credentials to access your account.</p>
            <form action="#" method="post" id="loginForm">
                <div class="form-group">
                    <label for="email">Email address</label>
                    <input type="email" name="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" name="password" id="password" required>
                    <small><a href="forgot.html">Forgot password?</a></small>
                </div>
                <div class="form-group">
                    <button type="submit" class="btn" id="loginSubmit" value="Login" disabled>
                        <i class="fa-solid fa-right-to-bracket"></i> Login
                    </button>
                </div>
            </form>
        </div>
        <div class="page-content-right">
            <p>Don't have an account? <a href="register.html">Register here</a>.</p>
          
        </div>
    </div>
    <div class="footer-row">
        <small>&copy; 2026 Work Management. All rights reserved.</small></p>
    </div>

    <script src="https://kit.fontawesome.com/8b41e2246c.js" crossorigin="anonymous"></script>
</body>
</html>
